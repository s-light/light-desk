# SPI plugin config for olad - PocketBeagle 1 variant
# docs: https://docs.openlighting.org/ola/conf/ola-spi.conf.html
#
# One APA102 LED strip output on SPI1 (see
# ../overlays/BB-SPI1-APA102-light-desk-00A0.dts, installed by
# ../setup_pb1.py's "overlays" step - P1.33/P1.36/P2.30/P2.32, a
# single spidev channel, deliberately not sharing the bus with any
# second device). This is a different kind of fixture than the 4 DMX
# universes (a pixel strip, not a DMX512 device), so it gets its own
# dedicated sACN universe (5) rather than mirroring one of
# universes 1-4 - see ../ola-e131.conf's input_ports=5 and
# lightdesk_setup.patch_spi_apa102(), called from setup_pb1.py's
# "ola" step.
#
# The plugin auto-discovers /dev/spidev* devices (device_prefix below)
# rather than taking an explicit "device = " list like uartdmx - our
# overlay only creates one, /dev/spidev1.0 (SPI bus 1, chip-select 0),
# so that's the device name these keys are scoped under.
#
# Personality 7 = APA102_INDIVIDUAL (plain R/G/B per pixel, 3 DMX/sACN
# slots each, no extra global-brightness slot) - confirmed against
# the actual enum in OLA's plugins/spi/SPIOutput.h
# (PERS_WS2801_INDIVIDUAL=1 ... PERS_APA102_INDIVIDUAL=7,
# PERS_APA102_COMBINED=8, ...; these are RDM personality IDs, 1-based
# by design, used directly as config values - not a guess).
#
# pixel-count below is 70 (the strip is wired as a 7x10 = 70 pixel
# matrix, one long APA102 chain) - directly determines how many
# sACN/DMX slots this port uses (3 * pixel-count = 210).
#
# install: run ../setup_pb1.py's "ola" step (re-enables the "spi"
# plugin for PB1 on top of its usual e131/uartdmx/dummy set), or copy
# to $CONFIG_DIR (see olad.service, default /etc/ola) as
# "ola-spi.conf" by hand, then restart olad.

enabled = true
device_prefix = spidev

spidev1.0-ports = 1
spidev1.0-0-personality = 7
spidev1.0-0-pixel-count = 70
spidev1.0-0-dmx-address = 1
