# UART native DMX plugin config for olad - PocketBeagle 1 variant
# docs: https://docs.openlighting.org/ola/conf/ola-uartdmx.conf.html
#
# 4 DMX outputs, one per UART, for the 4 sACN universes coming in via
# ola-e131.conf (see ../memo.md's "Decision (2026-09-27): stopping at 4
# universes for PB1"). This plugin drives the UART directly (no
# USB-serial adapters, no external microcontroller) - matches the
# README's "UART for dmx output" goal.
#
# Device paths per ../setup.md's "DMX universe / overlay pin map":
# ttyS1 (UART1, stock overlay), ttyS2 (UART2, stock overlay), ttyS3
# (UART3, this repo's custom overlay - see ../overlays/ and
# ../install-uart3-overlay.sh), ttyS4 (UART4, enabled in base dts, no
# overlay needed). ttyS0 (UART0/console) is NOT used - the console
# switch needed to free it reproducibly hung the board, see ../memo.md;
# PB1 stops at 4 universes instead of chasing a 5th.
#
# install: run ../apply-ola-config.sh (wraps the shared
# ../../apply-ola-config.sh with this dir + NUM_UNIVERSES=4), or copy to
# $CONFIG_DIR (see olad.service, default /etc/ola) as "ola-uartdmx.conf"
# by hand, then restart olad.

enabled = true

# One "device" line per UART - OLA reads repeated keys as a list.
device = /dev/ttyS1
device = /dev/ttyS2
device = /dev/ttyS3
device = /dev/ttyS4

# Per-device timing overrides go here if a fixture needs non-default
# break/mark-after-last-frame timing (both default to 100us, which is
# fine for standard DMX512 receivers):
# /dev/ttyS1-break = 100
# /dev/ttyS1-malf = 100
