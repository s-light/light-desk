# E1.31 (sACN) plugin config for olad - PocketBeagle 1 variant
# docs: https://docs.openlighting.org/ola/conf/ola-e131.conf.html
#
# 4 sACN input ports (universes 1-4), no E1.31 output needed for this
# project (DMX leaves the board via UART, see ola-uartdmx.conf). 4, not
# 5: PB1 stops at 4 confirmed DMX universes - see ../memo.md's
# "Decision (2026-09-27): stopping at 4 universes for PB1" and
# ../setup.md's universe/overlay pin map.
#
# install: run ../apply-ola-config.sh (wraps the shared
# ../../apply-ola-config.sh with this dir + NUM_UNIVERSES=4), or copy to
# $CONFIG_DIR (see olad.service, default /etc/ola) as "ola-e131.conf" by
# hand, then restart olad.

enabled = true
input_ports = 4
output_ports = 0

# Left at the default (first non-loopback interface). If the board has
# more than one network interface once the sACN source is wired up, set
# this explicitly to the interface name or IP that should receive sACN,
# e.g.:
# ip = eth0
