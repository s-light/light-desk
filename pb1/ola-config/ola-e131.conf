# E1.31 (sACN) plugin config for olad - PocketBeagle 1 variant
# docs: https://docs.openlighting.org/ola/conf/ola-e131.conf.html
#
# 5 sACN input ports: universes 1-4 for the 4 DMX/UART outputs (PB1
# stops at 4 confirmed DMX universes - see ../memo.md's "Decision
# (2026-09-27): stopping at 4 universes for PB1" and ../setup.md's
# universe/overlay pin map), plus universe 5 dedicated to the single
# APA102 output on SPI1 (see ola-spi.conf - a pixel strip is a
# different kind of fixture than a DMX512 line, so it gets its own
# universe rather than mirroring one of 1-4). No E1.31 output needed
# for this project.
#
# install: run ../apply-ola-config.sh (wraps the shared
# ../../apply-ola-config.sh with this dir + NUM_UNIVERSES=4 for the
# DMX/UART patch loop - universe 5/the SPI device is patched
# separately, see apply-ola-config.sh), or copy to $CONFIG_DIR (see
# olad.service, default /etc/ola) as "ola-e131.conf" by hand, then
# restart olad.

enabled = true
input_ports = 5
output_ports = 0

# Left at the default (first non-loopback interface). If the board has
# more than one network interface once the sACN source is wired up, set
# this explicitly to the interface name or IP that should receive sACN,
# e.g.:
# ip = eth0
