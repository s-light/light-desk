# E1.31 (sACN) plugin config for olad
# docs: https://docs.openlighting.org/ola/conf/ola-e131.conf.html
#
# 6 sACN input ports (universes 1-6), no E1.31 output needed for this
# project (DMX leaves the board via UART, see ola-uartdmx.conf).
#
# install: copy to $CONFIG_DIR (see olad.service, default /etc/ola) as
# "ola-e131.conf", then restart olad.

enabled = true
input_ports = 6
output_ports = 0

# Left at the default (first non-loopback interface). If the board has
# more than one network interface once the sACN source is wired up
# (e.g. the USB interface used for internet sharing, see
# pocketbeagle2-internet-sharing.md, vs. the interface actually carrying
# sACN), set this explicitly to the interface name or IP that should
# receive sACN, e.g.:
# ip = eth0
