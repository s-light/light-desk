# UART native DMX plugin config for olad
# docs: https://docs.openlighting.org/ola/conf/ola-uartdmx.conf.html
#
# 6 DMX outputs, one per UART, for the 6 sACN universes coming in via
# ola-e131.conf. This plugin drives the UART directly (no USB-serial
# adapters, no external microcontroller) - matches the README's
# "UART for dmx output" goal.
#
# TODO before deploying: the device paths below (/dev/ttyS1 .. ttyS6)
# are PLACEHOLDERS. PocketBeagle 2 UARTs are only exposed on header pins
# once a matching device tree overlay is enabled per UART instance (see
# https://docs.zephyrproject.org/latest/boards/beagle/pocketbeagle_2/doc/pocketbeagle_2.html
# and the k3-am62-pocketbeagle2 overlays), and it is not yet confirmed
# that 6 UART instances can be routed to header pins simultaneously on
# this board. Verify the actual /dev/ttyS<N> assignments (and enable the
# overlays) before relying on this file - adjust the "device" lines to
# match.
#
# install: copy to $CONFIG_DIR (see olad.service, default /etc/ola) as
# "ola-uartdmx.conf", then restart olad.

enabled = true

# One "device" line per UART - OLA reads repeated keys as a list.
device = /dev/ttyS1
device = /dev/ttyS2
device = /dev/ttyS3
device = /dev/ttyS4
device = /dev/ttyS5
device = /dev/ttyS6

# Per-device timing overrides go here if a fixture needs non-default
# break/mark-after-last-frame timing (both default to 100us, which is
# fine for standard DMX512 receivers):
# /dev/ttyS1-break = 100
# /dev/ttyS1-malf = 100
