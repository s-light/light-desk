# UART native DMX plugin config for olad
# docs: https://docs.openlighting.org/ola/conf/ola-uartdmx.conf.html
#
# 5 DMX outputs, one per UART, for the 5 sACN universes coming in via
# ola-e131.conf. This plugin drives the UART directly (no USB-serial
# adapters, no external microcontroller) - matches the README's
# "UART for dmx output" goal.
#
# Device paths verified on real hardware (not placeholders): ttyS1,
# ttyS3, ttyS4, ttyS5 need the overlay at
# ../overlays/k3-am62-pocketbeagle2-light-desk-uart-dmx.dtso to be built
# and enabled (see setup.md); ttyS7 (uart0) works out of the box. ttyS2
# is deliberately excluded - it's the console/debug-probe UART. ttyS6
# (uart2) doesn't exist as a routable option on this board at all - no
# pin-mux entry for it anywhere in the PocketBeagle 2 device tree.
#
# install: copy to $CONFIG_DIR (see olad.service, default /etc/ola) as
# "ola-uartdmx.conf", then restart olad.

enabled = true

# One "device" line per UART - OLA reads repeated keys as a list.
device = /dev/ttyS1
device = /dev/ttyS3
device = /dev/ttyS4
device = /dev/ttyS5
device = /dev/ttyS7

# Per-device timing overrides go here if a fixture needs non-default
# break/mark-after-last-frame timing (both default to 100us, which is
# fine for standard DMX512 receivers):
# /dev/ttyS1-break = 100
# /dev/ttyS1-malf = 100
